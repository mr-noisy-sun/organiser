<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6b7280">
<title>Organiser v27.48</title>
<style>
:root { --bg:#f5f5f7; --surface:#fff; --text:#1d1d1f; --text-sec:#6e6e73; --accent:#6b7280; --border:#e0e0e0; --nav-h:72px; --safe-b:env(safe-area-inset-bottom,0px); }
[data-theme="dark"] { --bg:#1c1c1e; --surface:#2c2c2e; --text:#f5f5f7; --text-sec:#98989d; --accent:#9ca3af; --border:#3a3a3c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: Helvetica, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:var(--text); height:100dvh; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100%; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:6px 16px; display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:1.3rem; font-weight:650; }
.header-actions { display:flex; gap:4px; } .header-actions button { background:none; border:none; padding:4px; color:var(--text); width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
#main { flex:1; overflow-y:auto; padding:12px 14px calc(var(--nav-h) + var(--safe-b) + 16px); }
nav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:var(--safe-b); }
nav button { flex:1; background:none; border:none; font-size:0.68rem; color:var(--text-sec); padding:4px 0 16px; }
nav button.active { color:var(--accent); font-weight:600; }
.item { border-radius:10px; margin-bottom:5px; padding:7px 10px; }
[data-theme="light"] .item { background:color-mix(in srgb, var(--c,#6b7280) 18%, var(--surface)); }
[data-theme="dark"] .item { background:var(--c,#6b7280); color:#fff; }
[data-theme="dark"] .item .m { color:rgba(255,255,255,0.85); }
.item.done { opacity:0.55; }
.item.selected { outline:3px solid #fff; }
.item-inner { display:flex; align-items:flex-start; width:100%; }
.item-inner > * { flex:0 0 auto; }
.item input[type=checkbox] { width:22px; min-width:22px; margin-top:2px; margin-right:10px; }
.item .txt { flex:1; min-width:0; }
.item .t { font-weight:550; }
.item .m { font-size:0.75rem; margin-top:2px; display:block; }
.sec { margin-bottom:18px; }
.sec h2 { font-size:1.15rem; font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; color:var(--text); }
.sec-body.collapsed { display:none; }
.block { background:var(--surface); border-radius:12px; margin-bottom:8px; border:1px solid var(--border); }
.sec-h, .block-h { font-weight:500; }
.block.off { opacity:0.5; }
.block.off .block-h { text-decoration:line-through; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:100; }
.modal.hide { display:none; }
.modal-c { background:var(--surface); width:100%; max-height:92vh; border-radius:16px 16px 0 0; padding:16px; overflow-y:auto; }
label { display:block; font-size:0.85rem; margin-top:8px; color:var(--text-sec); }
input,select,textarea,.btn { width:100%; padding:11px; margin:4px 0 8px; border:1px solid var(--border); border-radius:10px; font-size:1rem; background:var(--bg); color:var(--text); }
input[type=date], input[type=color] { height:44px; }
.btn { background:#4a4a4e; color:#fff; border:none; font-weight:600; }
.btn-main { background:#76BB40; color:#fff; }
.small.btn { background:#4a4a4e; }
.small.btn.btn-main { background:#76BB40; }
.small { font-size:0.75rem; padding:5px 8px; width:auto; display:inline-block; }
#ver { position:fixed; bottom:8px; right:10px; font-size:11px; opacity:0.6; background:var(--surface); padding:2px 6px; border-radius:4px; z-index:10; }
.tag { display:inline-block; background:var(--border); color:var(--text); font-size:0.7rem; padding:2px 6px; border-radius:8px; margin-right:4px; }
.habit-cal { display:flex; gap:4px; margin-top:6px; overflow-x:auto; padding-bottom:4px; }
.habit-day { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:0.65rem; }
.habit-day.done { background:#34c759; border-color:#34c759; color:#fff; }
.habit-day.skip { background:transparent; border-style:dashed; }
.habit-streak { height:2px; background:#34c759; margin:2px 0; }
.netlify-badge, [data-netlify-badge], iframe[src*="netlify"], a[href*="netlify.com"] { display:none !important; }</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Today</h1>
    <div class="header-actions">
      <button id="search" title="Search"></button>
      <button id="lookup" title="Look up"></button>
      <button id="add" style="font-size:1.9rem;font-weight:300;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;margin-top:-3px">+</button>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-p="today" class="active" title="My Day"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
    <button data-p="tasks" title="Tasks"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg></button>
    <button data-p="notes" title="Notes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></button>
    <button data-p="habits" title="Habits"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l2.5 2.5L16 9"/></svg></button>
    <button data-p="cal" title="Calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    <button data-p="inbox" title="Inbox"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3H10l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg></button>
    <button data-p="more" title="More"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg></button>
  </nav>
</div>
<div id="ver">v27.48</div>
<div id="modal" class="modal hide"><div class="modal-c"><span id="close" style="float:right;font-size:1.6rem;margin-right:12px">&times;</span><div id="mbody"></div></div></div>
<script>
document.getElementById('search').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
document.getElementById('lookup').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';

const DB='org-v4';
let db, page='today', settings={theme:'auto',gentle:true,search:'https://www.google.com/search?q=', sort:'due'};
let selected = new Set();
let selectMode = false;
let routines = [];

const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;['items','projects','resources','settings','countdowns','notes'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true});});};});
async function init(){db=await openDB();await loadSet();applyTheme();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');go(b.dataset.p);});document.getElementById('add').onclick=quickAdd;document.getElementById('search').onclick=inSearch;document.getElementById('lookup').onclick=()=>{const q=prompt('Look up:');if(q){const a=document.createElement('a');a.href=settings.search+encodeURIComponent(q);a.target='_blank';a.rel='noopener';a.click();}};document.getElementById('close').onclick=()=>document.getElementById('modal').classList.add('hide');if((await all('items')).length===0)await seed();go('today');}
async function loadSet(){const s=await all('settings');if(s[0]){settings={...settings,...s[0]}; if(Array.isArray(s[0].routines)) routines = s[0].routines; }}
function saveSet(){settings.routines = routines; db.transaction('settings','readwrite').objectStore('settings').put({id:1,...settings});}
function applyScheme(){
  const s = settings.scheme || 'default';
  const root = document.documentElement;
  if(s==='warm'){ root.style.setProperty('--bg','#1f1c1a'); root.style.setProperty('--surface','#2e2a28'); root.style.setProperty('--border','#3f3a37'); }
  else if(s==='cool'){ root.style.setProperty('--bg','#1a1c1f'); root.style.setProperty('--surface','#282b2e'); root.style.setProperty('--border','#373a3e'); }
  else { root.style.removeProperty('--bg'); root.style.removeProperty('--surface'); root.style.removeProperty('--border'); }
}
function applyTheme(){document.documentElement.dataset.theme=settings.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):settings.theme; applyFont(); applyScheme();}
function applyFont(){
  const f = settings.font || 'Geneva,sans-serif';
  document.body.style.fontFamily = f;
  document.querySelectorAll('button,.btn,input,select,textarea,label,h1,h2,h3,.sec-h,.block-h,.item,.m,.t').forEach(el => { el.style.fontFamily = f; });
}
const all=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[]);});
const put=(s,o)=>new Promise(r=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=r;});
const add=(s,o)=>new Promise(r=>{const t=db.transaction(s,'readwrite');const q=t.objectStore(s).add(o);q.onsuccess=()=>r(q.result);});
function modal(h){document.getElementById('mbody').innerHTML=h;document.getElementById('modal').classList.remove('hide');}


function showRecExtra(){
  const sel = document.getElementById('rec') || document.getElementById('erec');
  if (!sel) return;
  const v = sel.value;
  const el = document.getElementById('recextra') || document.getElementById('erecextra');
  if (!el) return;
  if(v==='weekly') el.innerHTML = '<label>On day</label><select id="recday"><option>Any</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select>';
  else if(v==='monthly') el.innerHTML = '<label>On the</label><input id="recdom" type="number" min="1" max="31" placeholder="e.g. 25">';
  else if(v==='custom'){const t=(window._cur&&window._cur.recTimes)||2;const e=(window._cur&&window._cur.recEvery)||1;const p=(window._cur&&window._cur.recPeriod)||'days';el.innerHTML = `<label>Times</label><input id="rectimes" type="number" min="1" value="${t}"><label>Every</label><input id="recevery" type="number" min="1" value="${e}"><select id="recperiod"><option ${p==='days'?'selected':''}>days</option><option ${p==='weeks'?'selected':''}>weeks</option><option ${p==='months'?'selected':''}>months</option><option ${p==='years'?'selected':''}>years</option></select>`;}
  else el.innerHTML = '';
}
async function quickAdd(){const items=await all('items');const ps=await all('projects');const cats=[...new Set(items.map(i=>i.cat).filter(Boolean))];setTimeout(()=>{const cl=document.getElementById('catlist');if(cl)cl.innerHTML=cats.map(c=>`<option value="${c}">`).join('');const pl=document.getElementById('projlist');if(pl)pl.innerHTML=ps.map(p=>`<option value="${p.name}">`).join('');},50);
  const defType = page==='ideas' ? 'idea' : 'task';
  modal(`<h2>Quick Add</h2>
    <input id="t" placeholder="Title" autofocus>
    <label>Due date</label><input id="d" type="date">
    <label>Recurrence</label><select id="rec" onchange="showRecExtra();document.getElementById('thabit').checked=!!this.value;document.getElementById('showcal').checked=!['daily','weekly','2xweek','3xweek'].includes(this.value)"><option value="">None</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="custom">X times every X period</option></select><div id="recextra"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <label><input type="checkbox" id="showtoday" checked> My Day</label>
      <label><input type="checkbox" id="remind" onchange="var o=document.getElementById('qremopts');if(o)o.style.display=this.checked?'block':'none'"> Reminder</label>
      <label><input type="checkbox" id="showcal" checked> Calendar</label>
      <label><input type="checkbox" id="thabit"> Habit</label>
    </div>
    <div id="qremopts" style="display:none"><select id="qrem1"><option value="">None</option><option value="0d">On the day</option><option value="1d">1 day before</option><option value="2d">2 days before</option><option value="7d">1 week before</option><option value="14d">2 weeks before</option><option value="28d">4 weeks before</option></select><select id="qrem2"><option value="">None</option><option value="0d">On the day</option><option value="1d">1 day before</option><option value="2d">2 days before</option><option value="7d">1 week before</option><option value="14d">2 weeks before</option><option value="28d">4 weeks before</option></select></div>
    <details style="margin:12px 0"><summary style="padding:8px 0">Details</summary>
    <label>Category</label><input id="c" list="catlist" placeholder="Category" value="[Misc]"><datalist id="catlist"></datalist>
    <label>Project</label><input id="proj" list="projlist" placeholder="Project"><datalist id="projlist"></datalist>
    <label>Tags</label><input id="tags" placeholder="comma separated">
    <label>Type</label><select id="ty"><option value="task" ${defType==='task'?'selected':''}>Task</option><option value="idea" ${defType==='idea'?'selected':''}>Idea</option></select>
    <label>Image URL</label><input id="img" placeholder="optional">
    <label>Notes</label><textarea id="notes"></textarea>
    <label>Colour</label><input id="col" type="color" value="#6b7280">
    </details>
    <button class="btn btn-main" id="s">Add</button>`);
  document.getElementById('s').onclick=async()=>{const title=document.getElementById('t').value.trim();if(!title)return;const tags=(document.getElementById('tags').value||'').split(',').map(t=>t.trim()).filter(Boolean);const projName=document.getElementById('proj').value.trim();let ps=await all('projects');let proj=ps.find(p=>p.name.toLowerCase()===projName.toLowerCase());if(projName&&!proj){await add('projects',{name:projName,created:Date.now(),trackProgress:true});ps=await all('projects');proj=ps.find(p=>p.name.toLowerCase()===projName.toLowerCase());}await add('items',{title,type:document.getElementById('ty').value,due:document.getElementById('d').value||null,recurrence:document.getElementById('rec').value||null,done:false,color:(settings.catColors||{})[document.getElementById('c').value]||document.getElementById('col').value,cat:document.getElementById('c').value||'[Misc]',tags,projectId:proj?proj.id:null,created:Date.now(),notes:document.getElementById('notes')?.value||'',image:document.getElementById('img')?.value||'',subtasks:[],trackHabit:document.getElementById('rec').value ? true : document.getElementById('thabit').checked,showInCal:document.getElementById('showcal').checked,showInToday:document.getElementById('showtoday').checked,reminder:document.getElementById('remind').checked,completions:{}});document.getElementById('modal').classList.add('hide');go(page);};
}

function inSearch(){modal(`<h2>Search</h2><input id="q" placeholder="Search..." autofocus><div id="res"></div>`);document.getElementById('q').oninput=async e=>{const q=e.target.value.toLowerCase();const items=await all('items');document.getElementById('res').innerHTML=items.filter(i=>i.title.toLowerCase().includes(q)).map(i=>`<div class="item" style="--c:${i.color}"><div class="t">${i.title}</div></div>`).join('')||'No matches';};}

async function go(p){
  page=p; if(!selectMode)selected.clear();
  const titles={today:'My Day',tasks:'Tasks',ideas:'Ideas',habits:'Habits',cal:'Calendar',more:'More',inbox:'Inbox',projects:'Projects',resources:'Resources',review:'Insights',ins:'Insights',routines:'Routines',notes:'Notes'};
  const svgs={
    tasks:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
    ideas:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.5V16a1 1 0 001 1h6a1 1 0 001-1v-1.5A7 7 0 0012 2z"/></svg>',
    habits:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>',
    cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    projects:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>',
    resources:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
    notes:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>'
  };
  const titleEl = document.querySelector('header h1');
  if(p==='today'){
    const d = new Date();
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr = `(${days[d.getDay()]} ${d.getDate()}${['st','nd','rd'][((d.getDate()+90)%100-10)%10-1]||'th'} ${months[d.getMonth()]} ${d.getFullYear()})`;
    titleEl.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>My Day <span style="font-size:0.75rem;font-weight:400;opacity:0.8">${dateStr}</span>`;
  } else {
    titleEl.innerHTML = (svgs[p] ? `<span style="margin-right:6px;vertical-align:middle">${svgs[p]}</span>` : '') + (titles[p]||p);
  }
  const m=document.getElementById('main');
  if(p==='today')await renderToday(m);
  else if(p==='tasks')await renderList(m,'task');
  else if(p==='ideas')await renderList(m,'idea');
  else if(p==='habits')await renderHabits(m);
  else if(p==='cal')await renderCal(m);
  else if(p==='inbox'){ titleEl.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px"><path d="M22 12h-6l-2 3H10l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>Inbox`; await renderInbox(m); }
  else if(p==='projects')await renderProjects(m);
  else if(p==='resources')await renderResources(m);
  else if(p==='review'||p==='ins')await renderInsights(m);
  else if(p==='routines')await renderRoutinesPage(m);
  else if(p==='notes')await renderNotes(m);
  else renderMore(m);
  applyFont();
}

let calFiltOpen=false;function toggleCalHide(type, show){
  settings.calHide = settings.calHide || [];
  if(show) settings.calHide = settings.calHide.filter(x=>x!==type);
  else if(!settings.calHide.includes(type)) settings.calHide.push(type);
  saveSet();
  const dayEl = document.getElementById("daylist");
  const currentDay = dayEl ? (dayEl.querySelector("h3")||{}).textContent : null;
  go("cal");
  if(currentDay) setTimeout(()=>showDay(currentDay, true), 50);
  saveSet();
}
function toggleRoutineLine(rid, idx){
  const r = routines.find(x=>x.id===rid);
  if(!r) return;
  r.done = r.done || {};
  r.done[idx] = !r.done[idx];
  saveSet();
  go('today');

  Object.keys(groups).forEach(c => {
    h += '<div class="sec"><div class="sec-h" onclick="var b=this.nextElementSibling; b.style.display=b.style.display===\'none\'?\'block\':\'none\'; settings.collapsed=settings.collapsed||{}; settings.collapsed[\'hab-\'+this.textContent.trim()]=b.style.display===\'none\'; saveSet();" style="font-weight:600;font-size:1.05rem;margin-top:8px;padding:6px 0;border-bottom:1px solid var(--border)">'+c+'</div><div class="sec-body">';

    let streak = 0;
    for(let i=0;i<60;i++){
      const d = new Date(today); d.setDate(d.getDate()-i);
      const k = d.toISOString().slice(0,10);
      if(comps[k]==='done') streak++;
      else if(comps[k]==='skip') break;
      else if(i>window) break;
    }
    let cal = '<div class="habit-cal" style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">';
    for(let i=13;i>=0;i--){
      const d = new Date(today); d.setDate(d.getDate()-i);

      const st = comps[k];
      cal += '<div style="width:22px;height:22px;border-radius:50%;background:'+(st==='done'?'#34c759':'#3a3a3c')+';border:'+(st==='skip'?'2px dotted #ff9500':'none')+';display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:#fff;cursor:pointer" onclick="event.stopPropagation();quickMark('+it.id+',\''+k+'\')">'+(st==='done'?'✓':'')+'</div>';

async function quickMark(id,date){
  const items=await all('items');
  const it=items.find(x=>x.id==id);
  if(!it)return;
  it.completions=it.completions||{};
  const cur=it.completions[date];
  const next=cur==='done'?'skip':cur==='skip'?null:'done';
  if(next) it.completions[date]=next; else delete it.completions[date];
  const today=new Date().toISOString().slice(0,10);
  if(date===today && it.recurrence){
    if(next==='done' || next==='skip'){
      if(!it._advancedToday){
        const d=new Date(it.due||Date.now());
        if(it.recurrence==='daily')d.setDate(d.getDate()+1);
        else if(it.recurrence==='weekly')d.setDate(d.getDate()+7);
        else if(it.recurrence==='monthly')d.setMonth(d.getMonth()+1);
        else if(it.recurrence==='yearly')d.setFullYear(d.getFullYear()+1);
        else if(it.recurrence==='custom'&&it.recEvery&&it.recPeriod){
          const n=it.recEvery||1;
          if(it.recPeriod==='days')d.setDate(d.getDate()+n);
          else if(it.recPeriod==='weeks')d.setDate(d.getDate()+n*7);
          else if(it.recPeriod==='months')d.setMonth(d.getMonth()+n);
          else if(it.recPeriod==='years')d.setFullYear(d.getFullYear()+n);
        }
        it.due=d.toISOString().slice(0,10);
        it._advancedToday=true;
      }
      it.done=false;
    } else {
      // incomplete - revert if advanced
      if(it._advancedToday){
        const d=new Date(it.due);
        if(it.recurrence==='daily')d.setDate(d.getDate()-1);
        else if(it.recurrence==='weekly')d.setDate(d.getDate()-7);
        else if(it.recurrence==='monthly')d.setMonth(d.getMonth()-1);
        else if(it.recurrence==='yearly')d.setFullYear(d.getFullYear()-1);
        else if(it.recurrence==='custom'&&it.recEvery&&it.recPeriod){
          const n=it.recEvery||1;
          if(it.recPeriod==='days')d.setDate(d.getDate()-n);
          else if(it.recPeriod==='weeks')d.setDate(d.getDate()-n*7);
          else if(it.recPeriod==='months')d.setMonth(d.getMonth()-n);
          else if(it.recPeriod==='years')d.setFullYear(d.getFullYear()-n);
        }
        it.due=d.toISOString().slice(0,10);
        it._advancedToday=false;
      }
      it.done=false;
    }
  } else if(date===today && !it.recurrence){
    it.done = next==='done';
  }
  if(next==='done'){const ts=new Date(date).getTime();if(!it.last||ts>it.last)it.last=ts;}
  await put('items', JSON.parse(JSON.stringify(it)));
  go('habits');
}

async function markHabit(id, status){
  const items = await all('items');
  const it = items.find(x => x.id == id);
  if (!it) return;
  it.completions = it.completions || {};
  const key = new Date().toISOString().slice(0,10);
  it.completions[key] = status;
  if (status === 'done') {
    it.last = Date.now();
    if (it.recurrence) {
      const d = new Date(it.due || Date.now());
      if (it.recurrence === 'daily') d.setDate(d.getDate()+1);
      else if (it.recurrence === 'weekly') d.setDate(d.getDate()+7);
      else if (it.recurrence === 'monthly') d.setMonth(d.getMonth()+1);
      else if (it.recurrence === 'yearly') d.setFullYear(d.getFullYear()+1);
      else if (it.recurrence === 'custom' && it.recEvery && it.recPeriod) {
        const n = it.recEvery || 1;
        if (it.recPeriod === 'days') d.setDate(d.getDate()+n);
        else if (it.recPeriod === 'weeks') d.setDate(d.getDate()+n*7);
        else if (it.recPeriod === 'months') d.setMonth(d.getMonth()+n);
        else if (it.recPeriod === 'years') d.setFullYear(d.getFullYear()+n);
      }
      it.due = d.toISOString().slice(0,10);
      it.done = false;
    } else {
      it.done = true;
    }
  }
  await put('items', it);
  go('habits');
}

async function moveNote(id, dir){

  notes = notes.map((n,i)=>({...n, order: n.order==null ? i : n.order}));

  const idx = sorted.findIndex(n=>n.id===id);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=sorted.length) return;
  const a = {...sorted[idx]}, b = {...sorted[newIdx]};
  const tmp = a.order;
  a.order = b.order;
  b.order = tmp;
  await put('notes', a);
  await put('notes', b);
  go('notes');
}

function moveInArray(arr, idx, dir){
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= arr.length) return arr;
  const copy = arr.slice();
  const tmp = copy[idx];
  copy[idx] = copy[newIdx];
  copy[newIdx] = tmp;
  return copy;
}

async function toggleComplete(id){
  const items = await all('items');
  const it = items.find(x => x.id == id);
  if(!it) return;
  it.done = !it.done;
  const todayKey = new Date().toISOString().slice(0,10);
  it.completions = it.completions || {};
  if(it.done){
    it.last = Date.now();
    it.completions[todayKey] = 'done';
  } else {
    delete it.completions[todayKey];
  }
  await put('items', it);
  document.getElementById('modal').classList.add('hide');
  go(page);
}
function confirmDel(id){
  const mbody = document.getElementById('mbody');
  mbody.innerHTML = `<h2>Delete?</h2><p>This cannot be undone.</p><button class="btn" style="background:#c00" onclick="delItem(${id})">Yes, delete</button><button class="btn" style="background:#666" onclick="openItem(${id})">Cancel</button>`;
}
async function delItem(id){ const tx=db.transaction('items','readwrite'); tx.objectStore('items').delete(Number(id)); tx.oncomplete=()=>{document.getElementById('modal').classList.add('hide');go(page);}; }
function reschedule(id){modal(`<h2>Reschedule</h2><button class="btn" onclick="doResched(${id},1)">Tomorrow</button><button class="btn" onclick="doResched(${id},7)">In 1 week</button><input id="rdays" type="number" placeholder="X days"><button class="btn" onclick="doResched(${id},+document.getElementById('rdays').value||1)">Apply</button>`);}
async function doResched(id,days){const items=await all('items');const it=items.find(x=>x.id==id);if(!it)return;const d=new Date();d.setDate(d.getDate()+Number(days));it.due=d.toISOString().slice(0,10);await put('items', JSON.parse(JSON.stringify(it)));document.getElementById('modal').classList.add('hide');go(page);}

function bind(){document.querySelectorAll('input[data-id]').forEach(c=>c.onchange=async()=>{
  const items=await all('items');
  const it=items.find(x=>x.id==c.dataset.id);
  if(!it)return;
  const todayKey=new Date().toISOString().slice(0,10);
  if(c.checked){ c.parentElement.style.opacity="0.5"; setTimeout(()=>c.parentElement.style.opacity="",400);
    it.last=Date.now();
    it.completions=it.completions||{};
    it.completions = it.completions || {}; it.completions[todayKey]='done';
    if(it.recurrence){
      const d=new Date(it.due||Date.now());
      if(it.recurrence==='daily')d.setDate(d.getDate()+1);
      else if(it.recurrence==='weekly')d.setDate(d.getDate()+7);
      else if(it.recurrence==='monthly')d.setMonth(d.getMonth()+1);
      else if(it.recurrence==='yearly')d.setFullYear(d.getFullYear()+1);
      else if(it.recurrence==='custom'&&it.recEvery&&it.recPeriod){
        const n=it.recEvery||1;
        if(it.recPeriod==='days')d.setDate(d.getDate()+n);
        else if(it.recPeriod==='weeks')d.setDate(d.getDate()+n*7);
        else if(it.recPeriod==='months')d.setMonth(d.getMonth()+n);
        else if(it.recPeriod==='years')d.setFullYear(d.getFullYear()+n);
      }
      it.due=d.toISOString().slice(0,10);
      it.done=false; // stays open for next occurrence
    } else {
      it.done=true;
    }
  } else {
    it.done=false;
    if (it.completions) delete it.completions[todayKey];
  }
  await put('items', JSON.parse(JSON.stringify(it)));
  go(page);
});}

ick="settings.habitFilter=(settings.habitFilter||'all')==='all'?'oneoff':settings.habitFilter==='oneoff'?'habits':'all';saveSet();go(page)">${(settings.habitFilter||'all')==='all'?'All':settings.habitFilter==='oneoff'?'One-off':'Habits'}</button> <button class="small btn" onclick="settings.showTagFilter=!settings.showTagFilter;saveSet();go(page)">Tags</button> <button class="small btn" onclick="settings.showSort=!settings.showSort;saveSet();go(page)">Sort</button> <button class="small btn" onclick="settings.taskBoard=!settings.taskBoard;saveSet();go(page)">${settings.taskBoard?'List':'Board'}</button> <button class="small btn" onclick="showPasteModal()">Paste</button> <button class="small btn" onclick="selectMode=true;go(page)">Select</button> <div id="tagfilterbox" style="display:${settings.showTagFilter?'block':'none'};margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px;width:100%"></div>`;if(selected.size && selectMode)extra+=`<div style="margin-top:6px"><button class="small btn" style="background:#555" onclick="bulkResched()">Reschedule</button> <button class="small btn" style="background:#555" onclick="bulkComplete()">Complete</button> <button class="small btn" style="background:#555" onclick="bulkIncomplete()">Incomplete</button> <button class="small btn" style="background:#555" onclick="bulkEdit()">Bulk edit</button> <button class="small btn" style="background:#c00" onclick="bulkDelete()">Delete</button></div>`;if(settings.taskBoard && type==='task'){el.innerHTML=`<div class="sec">${extra}<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;row-gap:12px">${items.map(i=>`<div class="item" style="--c:${i.color};height:100px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px" onclick="openItem(${i.id})"><div class="t">${i.title}</div></div>`).join('')}</div></div>`;}else if(settings.sort==='cat'){

  }else{ const today=new Date().toISOString().slice(0,10); const ov=items.filter(i=>i.due&&i.due<today&&!i.done&&!['daily','weekly'].includes(i.recurrence||'')); const ovIds=new Set(ov.map(i=>i.id)); const rest=items.filter(i=>!ovIds.has(i.id)); let body=''; if(ov.length){ body+='<div class="sec"><div class="sec-h" onclick="var b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\';settings.collapsed=settings.collapsed||{};settings.collapsed[\'task-\'+this.textContent.trim()]=b.style.display===\'none\';saveSet();" style="font-weight:600;font-size:1.15rem;margin-top:8px;padding:6px 0">Overdue</div><div class="sec-body">'+ov.map(row).join('')+'</div></div>'; } if (settings.sort === 'due' && type === 'task') {

function applyTaskCollapsed(){
  if(!settings.collapsed) return;
  Object.keys(settings.collapsed).forEach(k=>{
    if(k.startsWith('task-') && settings.collapsed[k]){
      document.querySelectorAll('.sec-h').forEach(el=>{
        if(el.textContent.trim()===k.slice(5)){
          const body = el.nextElementSibling;
          if(body) body.style.display='none';
        }
      });
    }
  });
}

  const items = await all('items');

  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=sorted.length) return;

async function moveTaskInProject(tid, pid, dir){
  const items = await all('items');
  let linked = items.filter(i=>i.projectId===pid);
  linked.forEach((it,i)=>{ if(it.order==null) it.order = i; });
  linked.sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = linked.findIndex(i=>i.id===tid);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=linked.length) return;
  const tmp = linked[idx].order;
  linked[idx].order = linked[newIdx].order;
  linked[newIdx].order = tmp;
  await put('items', linked[idx]);
  await put('items', linked[newIdx]);
  openProject(pid);

async function moveProject(id, dir){
  const ps = await all('projects');
  const sort = settings.projSort || 'alpha';
  let sorted = [...ps];
  if(sort === 'cat'){
    const p = ps.find(x=>x.id===id);
    if(!p) return;
    sorted = ps.filter(x=>(x.cat||'None')===(p.cat||'None')).sort((a,b)=>(a.order||0)-(b.order||0));
  } else {
    sorted = ps.sort((a,b)=>(a.order||0)-(b.order||0));
  }
  const idx = sorted.findIndex(p=>p.id===id);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=sorted.length) return;
  const a = sorted[idx], b = sorted[newIdx];
  const tmp = a.order || idx;
  a.order = b.order || newIdx;
  b.order = tmp;
  await put('projects', a);
  await put('projects', b);
  go('projects');
}

async function renderInsights(el){
  const items = await all('items');

  let cutoff = 0;
  if(range==='week') cutoff = Date.now() - 7*86400000;
  if(range==='month') cutoff = Date.now() - 30*86400000; if(range==='day') cutoff = Date.now() - 86400000;

  const doneItems = items.filter(i => {
    if(i.done) return true;
    if(i.completions && Object.values(i.completions).includes('done')){
      if(range==='all') return true;
      return Object.entries(i.completions).some(([d,s]) => s==='done' && new Date(d).getTime() >= cutoff);
    }
    return false;
  });

  const byCat = {};
  doneItems.forEach(i=>{const c=i.cat||'None'; byCat[c]=(byCat[c]||0)+1;});
  const cats = Object.keys(byCat);
  const total = doneItems.length || 1;
  let pie = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">';

    const pct = Math.round((byCat[c]/total)*100);

  });
  pie += '</div>';

  const habits = items.filter(i=>i.trackHabit);
  const groups = {};
  habits.forEach(h=>{
    const comps = Object.entries(h.completions||{}).filter(([d,s])=>s==='done' && (range==='all' || new Date(d).getTime()>=cutoff)).length;
    let expected = 1;
    if(h.recurrence==='daily') expected = range==='day'?1:range==='week'?7:range==='month'?30:30;
    else if(h.recurrence==='weekly') expected = range==='week'?1:range==='month'?4:4;
    else if(h.recurrence==='monthly') expected = range==='month'?1:1;
    else expected = range==='day'?1:range==='week'?1:range==='month'?1:1;
    const pct = Math.min(100, Math.round((comps / expected) * 100));
    const last = h.last ? Math.round((Date.now()-h.last)/86400000) : '–';
    const c = h.cat || 'None';
    if(!groups[c]) groups[c] = [];
    groups[c].push({html:'<div style="display:grid;grid-template-columns:1fr 52px 72px;gap:8px;align-items:center;padding:4px 0;cursor:pointer" onclick="showHabitLog('+h.id+')"><span>'+h.title+'</span><span style="text-align:right">'+pct+'%</span><span style="text-align:right;color:var(--text-sec)">'+last+'d</span></div>', pct, last: last===999?999:last});
  });
  let habitHtml = '<div style="display:grid;grid-template-columns:1fr 52px 72px;gap:8px;padding:4px 0;font-size:0.8rem;color:var(--text-sec);border-bottom:1px solid var(--border);margin-bottom:4px"><span>Habit</span><span style="text-align:right;cursor:pointer" onclick="settings.habSort=\'pct\';saveSet();go(\'ins\')">%</span><span style="text-align:right;cursor:pointer" onclick="settings.habSort=\'days\';saveSet();go(\'ins\')">Days</span></div>';
  Object.keys(groups).forEach(c=>{
    const sorted = [...groups[c]].sort((a,b)=> settings.habSort==='days' ? (Number(b.last)||0) - (Number(a.last)||0) : (Number(a.pct)||0) - (Number(b.pct)||0));
    habitHtml += '<div class="sec"><div class="sec-h" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'" style="font-weight:600;font-size:1.05rem;margin-top:8px;padding:6px 0;border-bottom:1px solid var(--border)">'+c+'</div><div class="sec-body" style="padding-left:8px">'+sorted.map(x=>x.html).join('')+'</div></div>';
  });

  const top = cats.sort((a,b)=>byCat[b]-byCat[a])[0];
  const working = top ? top+' is your most completed category' + (range==='all'?' of all time':range==='day'?' today':' this '+range) : 'No completions yet';

    '<div style="margin:8px 0"><button class="small btn'+(range==='all'?' active':'')+'" onclick="settings.insRange=\'all\';saveSet();go(\'ins\')">All</button> <button class="small btn'+(range==='week'?' active':'')+'" onclick="settings.insRange=\'week\';saveSet();go(\'ins\')">This week</button> <button class="small btn'+(range==='month'?' active':'')+'" onclick="settings.insRange=\'month\';saveSet();go(\'ins\')">This month</button> <button class="small btn'+(range==='day'?' active':'')+'" onclick="settings.insRange=\'day\';saveSet();go(\'ins\')">Today</button></div>' +
    '<div class="sec"><div class="sec-h" onclick="toggleSec(this)" style="font-weight:600">Completed by category</div><div class="sec-body">'+(cats.length?pie:'<p>Nothing completed yet</p>')+'</div></div>' +

async function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      if (data.items) for (const it of data.items) await put('items', it);
      if (data.projects) for (const p of data.projects) await put('projects', p);
      if (data.resources) for (const r of data.resources) await put('resources', r);
      if (data.notes) for (const n of data.notes) await put('notes', n);
      if (data.countdowns) for (const c of data.countdowns) await put('countdowns', c);
      if (data.routines) { routines = data.routines; saveSet(); }
      if (data.settings) { settings = data.settings; saveSet(); }
      alert('Import complete');
      go(page);
    } catch (err) { alert('Import failed'); }
  };
  input.click();
}
async function exportData(){
  const data = {
    items: await all('items'),
    projects: await all('projects'),
    resources: await all('resources'),
    notes: await all('notes'),
    countdowns: await all('countdowns'),
    settings: settings,
    routines: routines
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'organiser-backup.json';
  a.click();
}
